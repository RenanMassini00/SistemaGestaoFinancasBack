name: Deploy backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: financeiro-back-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    environment: FinanceiroBack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ vars.DOCKER_PLATFORM || 'linux/amd64' }}
          tags: |
            renanmassini/financas-api:latest
            renanmassini/financas-api:${{ github.sha }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail

          for variable in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS SSH_HOST SSH_USER SSH_PORT; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Secret obrigatório vazio: $variable"
              exit 1
            fi
          done

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh-keygen -y -P "" -f "$HOME/.ssh/deploy_key" > /dev/null

          if [[ "$SSH_PORT" == "22" ]]; then
            lookup="$SSH_HOST"
          else
            lookup="[$SSH_HOST]:$SSH_PORT"
          fi
          ssh-keygen -F "$lookup" -f "$HOME/.ssh/known_hosts" > /dev/null

          ssh -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "id && docker info --format '{{.ServerVersion}}'"

      - name: Pull image and deploy API on server
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          IMAGE_TAG: renanmassini/financas-api:${{ github.sha }}
          CONTAINER_NAME: ${{ vars.DEPLOY_CONTAINER_NAME || 'financas-api' }}
          HOST_PORT: ${{ vars.DEPLOY_HTTP_PORT || '8082' }}
          DOCKER_NETWORK: ${{ vars.DEPLOY_DOCKER_NETWORK || '' }}
        run: |
          set -euo pipefail

          if [[ ! "$CONTAINER_NAME" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]*$ ]]; then
            echo "DEPLOY_CONTAINER_NAME contém caracteres inválidos."
            exit 1
          fi
          if [[ ! "$HOST_PORT" =~ ^[0-9]+$ || ${#HOST_PORT} -gt 5 ]]; then
            echo "DEPLOY_HTTP_PORT precisa ser uma porta entre 1 e 65535."
            exit 1
          fi
          port_number=$((10#$HOST_PORT))
          if (( port_number < 1 || port_number > 65535 )); then
            echo "DEPLOY_HTTP_PORT precisa ser uma porta entre 1 e 65535."
            exit 1
          fi
          if [[ -n "$DOCKER_NETWORK" && ! "$DOCKER_NETWORK" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]*$ ]]; then
            echo "DEPLOY_DOCKER_NETWORK contém caracteres inválidos."
            exit 1
          fi

          target="${SSH_USER}@${SSH_HOST}"
          remote_command="bash -s -- '$IMAGE_TAG' '$CONTAINER_NAME' '$HOST_PORT' '$DOCKER_NETWORK'"

          ssh -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o BatchMode=yes \
            -p "$SSH_PORT" "$target" "$remote_command" <<'REMOTE'
          set -Eeuo pipefail
          image_tag="$1"
          container_name="$2"
          host_port="$3"
          docker_network="$4"
          env_file="/home/deploy/financas-api.env"

          if [ ! -r "$env_file" ]; then
            echo "Arquivo de ambiente ausente ou sem permissão de leitura: $env_file"
            exit 1
          fi
          if ! command -v curl >/dev/null 2>&1; then
            echo "curl é necessário no servidor para verificar /health."
            exit 1
          fi
          for setting in \
            ConnectionStrings__DefaultConnection \
            JwtSettings__Key \
            JwtSettings__Issuer \
            JwtSettings__Audience; do
            if ! grep -Eq "^${setting}=.+" "$env_file"; then
              echo "Configuração obrigatória ausente no arquivo de ambiente: $setting"
              exit 1
            fi
          done

          network_args=()
          if [ -n "$docker_network" ]; then
            network_args+=(--network "$docker_network")
          fi

          docker pull "$image_tag"
          previous_image="$(docker inspect --format='{{.Image}}' "$container_name" 2>/dev/null || true)"
          docker rm --force "$container_name" >/dev/null 2>&1 || true

          run_api() {
            docker run --detach --name "$container_name" --restart unless-stopped \
              --env-file "$env_file" \
              --env ASPNETCORE_ENVIRONMENT=Production \
              --publish "127.0.0.1:${host_port}:8080" \
              "${network_args[@]}" "$1"
          }

          restore_previous() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
            if [ -n "$previous_image" ]; then
              run_api "$previous_image"
            fi
          }

          if ! run_api "$image_tag"; then
            restore_previous
            exit 1
          fi

          attempt=0
          until curl --fail --silent --show-error --max-time 3 \
            "http://127.0.0.1:${host_port}/health" >/dev/null; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 30 ]; then
              echo "A API não ficou saudável; restaurando a imagem anterior."
              restore_previous
              exit 1
            fi
            sleep 2
          done

          echo "Deploy concluído: $image_tag"
          REMOTE
